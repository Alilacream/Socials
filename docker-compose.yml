version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: socialx_db
    restart: always
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    ports:
      - "5432:5432"
volumes:
      postgres_data:
