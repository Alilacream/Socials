# no need for version no more
services:
  db:
    image: postgres:16-alpine
    container_name: socialx_db
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  
    networks:
      - socialx_network

networks:
  socialx_network:
    driver: bridge

volumes:
  postgres_data:
